# Netlify detects Next.js by itself and adds its runtime. This file only pins the basics.
[build]
  command = "npm run build"

[build.environment]
  # Next.js 16 needs Node 20.9 or newer.
  NODE_VERSION = "22"

# Environment variables are NOT stored here (they hold secrets). Set them in
# Netlify: Site configuration -> Environment variables. See README "Deploy on Netlify".
